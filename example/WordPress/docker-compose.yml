services:
  app:
    container_name: "${PROJECT_NAME}_app"
    image: "${APP_IMAGE}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./html:/var/www/html
      - ./.env:/var/www/.env:ro
    env_file:
      - ./.env
    environment:
      # WordPress Database Configuration
      WORDPRESS_DB_HOST: "${PROJECT_NAME}_db:${DB_PORT}"
      WORDPRESS_DB_NAME: "${DB_NAME}"
      WORDPRESS_DB_USER: "${DB_USER}"
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD}"
      WORDPRESS_TABLE_PREFIX: "${TABLE_PREFIX}"

      # WordPress Authentication Keys and Salts
      WORDPRESS_AUTH_KEY: "${WORDPRESS_AUTH_KEY}"
      WORDPRESS_SECURE_AUTH_KEY: "${WORDPRESS_SECURE_AUTH_KEY}"
      WORDPRESS_LOGGED_IN_KEY: "${WORDPRESS_LOGGED_IN_KEY}"
      WORDPRESS_NONCE_KEY: "${WORDPRESS_NONCE_KEY}"
      WORDPRESS_AUTH_SALT: "${WORDPRESS_AUTH_SALT}"
      WORDPRESS_SECURE_AUTH_SALT: "${WORDPRESS_SECURE_AUTH_SALT}"
      WORDPRESS_LOGGED_IN_SALT: "${WORDPRESS_LOGGED_IN_SALT}"
      WORDPRESS_NONCE_SALT: "${WORDPRESS_NONCE_SALT}"

      # WordPress Debug Settings (these are processed by the official image)
      WORDPRESS_DEBUG: "${DEBUG}"

      # WordPress Extra Configuration
      WORDPRESS_CONFIG_EXTRA: |
        /* Site URLs */
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');

        /* Database Charset & Collation */
        define('DB_CHARSET', '${DB_CHARSET}');
        define('DB_COLLATE', '${DB_COLLATE}');

        /* Debugging - Force enable */
        @ini_set('display_errors', ${DEBUG_DISPLAY} ? 1 : 0);
        define('WP_DEBUG', true);
        define('WP_DEBUG_DISPLAY', ${DEBUG_DISPLAY});
        define('WP_DEBUG_LOG', ${DEBUG_LOG});
        define('SCRIPT_DEBUG', ${SCRIPT_DEBUG});
        define('SAVEQUERIES', ${SAVEQUERIES});

        /* Performance */
        define('WP_CACHE', ${CACHE});
        define('COMPRESS_CSS', ${COMPRESS_CSS});
        define('COMPRESS_SCRIPTS', ${COMPRESS_SCRIPTS});
        define('CONCATENATE_SCRIPTS', ${CONCATENATE_SCRIPTS});
        define('ENFORCE_GZIP', ${ENFORCE_GZIP});

        /* Environment */
        define('WP_ENVIRONMENT_TYPE', '${ENVIRONMENT_TYPE}');
        define('WP_DEVELOPMENT_MODE', '${DEVELOPMENT_MODE}');

        /* Memory Limits */
        define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT}');
        define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT}');

        /* File System */
        define('FS_METHOD', '${FS_METHOD}');
        define('DISALLOW_FILE_EDIT', ${DISALLOW_FILE_EDIT});
        define('DISALLOW_FILE_MODS', ${DISALLOW_FILE_MODS});

        /* Auto-updates */
        define('AUTOMATIC_UPDATER_DISABLED', ${AUTOMATIC_UPDATER_DISABLED});
        define('WP_AUTO_UPDATE_CORE', ${WP_AUTO_UPDATE_CORE});

        /* Revisions & Autosave */
        define('WP_POST_REVISIONS', ${WP_POST_REVISIONS});
        define('AUTOSAVE_INTERVAL', ${AUTOSAVE_INTERVAL});

        /* Trash */
        define('EMPTY_TRASH_DAYS', ${EMPTY_TRASH_DAYS});

        /* Cookie Domain */
        if ('${COOKIE_DOMAIN}' !== '') {
            define('COOKIE_DOMAIN', '${COOKIE_DOMAIN}');
        }

        /* SSL/HTTPS (if behind proxy like Traefik) */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }

        /* Multisite */
        if (${WP_ALLOW_MULTISITE}) {
            define('WP_ALLOW_MULTISITE', true);
        }
        if (${MULTISITE}) {
            define('MULTISITE', true);
            define('SUBDOMAIN_INSTALL', ${SUBDOMAIN_INSTALL});
            define('DOMAIN_CURRENT_SITE', '${DOMAIN_CURRENT_SITE}');
            define('PATH_CURRENT_SITE', '${PATH_CURRENT_SITE}');
            define('SITE_ID_CURRENT_SITE', ${SITE_ID_CURRENT_SITE});
            define('BLOG_ID_CURRENT_SITE', ${BLOG_ID_CURRENT_SITE});
        }
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${ROOT_URL}`)"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80"
    depends_on:
      - db
    extra_hosts:
      - "${ROOT_URL}:host-gateway"
    restart: unless-stopped

  db:
    container_name: "${PROJECT_NAME}_db"
    image: ${DB_IMAGE}
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./data:/data
    networks:
      internal:
        aliases:
          - ${PROJECT_NAME}_db
    command:
      [
        "--character-set-server=${DB_CHARSET}",
        "--collation-server=${DB_COLLATE}",
      ]
    restart: unless-stopped

volumes:
  data: {}
  db_data: {}

networks:
  traefik:
    external: true
  internal:
    name: ${PROJECT_NAME}_internal
    driver: bridge
