services:
  app:
    container_name: "${PROJECT_NAME}_app"
    # image: "${APP_IMAGE}" - if you are not building but just using already built image then remove section args from build section and uncomment that line
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_IMAGE: ${APP_IMAGE}
    volumes:
      - ../html:/var/www/html
      - ../config/php/php.ini:/usr/local/etc/php/php.ini
      - ../config/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ../config/wordpress/wp-config.php:/var/www/html/wp-config.php:ro
      - ../config/msmtp/msmtprc:/etc/msmtprc:ro
    env_file:
      - ../.env
    extra_hosts:
      - "${ROOT_URL}:host-gateway"
    networks:
      - internal
    depends_on:
      - db
    restart: unless-stopped
